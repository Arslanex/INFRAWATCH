server {
    listen 80;
    server_name tricky.test;

    # a closing brace } inside a comment must not end the block
    add_header X-Odd "a;b{c}d" always;
    add_header X-Hash "https://x/#fragment";
    add_header X-Quote "she said \"hi\"";

    location / {
        # another } here
        try_files $uri $uri/ =404;
    }
}
