upstream backend {
    least_conn;
    server 127.0.0.1:3000 weight=2;
    server 127.0.0.1:3001;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name upstream.test;

    location / {
        proxy_pass http://backend;
        proxy_set_header Connection $connection_upgrade;
    }
}
